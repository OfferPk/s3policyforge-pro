<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <defs>
    <linearGradient id="bgArchS3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070a14"/>
      <stop offset="100%" stop-color="#03050a"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="500" fill="url(#bgArchS3)"/>

  <text x="500" y="45" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="700" font-size="20" text-anchor="middle">
    AWS S3 Security Architecture: Vulnerable Policy vs Zero-Trust Enforced
  </text>

  <!-- Left: Flawed Deployment -->
  <rect x="40" y="80" width="430" height="380" rx="10" fill="#140c14" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="55" y="95" width="400" height="34" rx="6" fill="#ef4444" fill-opacity="0.2"/>
  <text x="255" y="118" fill="#f87171" font-family="-apple-system, sans-serif" font-weight="700" font-size="14" text-anchor="middle">
    Vulnerable: Misconfigured Bucket Policy
  </text>

  <rect x="55" y="145" width="400" height="60" rx="6" fill="#080c1a" stroke="#242f5d"/>
  <text x="70" y="170" fill="#fca5a5" font-family="monospace" font-size="11">Principal: * &bull; Action: s3:GetObject, s3:PutObject</text>
  <text x="70" y="190" fill="#ef4444" font-family="-apple-system, sans-serif" font-size="11">Missing TLS Deny &bull; Missing VPC Gating &bull; PUBLIC WRITE!</text>

  <rect x="55" y="220" width="400" height="220" rx="6" fill="#1c0f18" stroke="#ef4444" stroke-opacity="0.4"/>
  <text x="70" y="245" fill="#f87171" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">CATASTROPHIC CLOUD EXPOSURE RISKS:</text>
  <text x="70" y="275" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="11">&bull; Anonymous users download corporate PII &amp; database backups</text>
  <text x="70" y="305" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="11">&bull; Ransomware attackers overwrite objects with encrypted payloads</text>
  <text x="70" y="335" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="11">&bull; Unencrypted HTTP requests exposed to plaintext sniffing</text>
  <text x="70" y="365" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="11">&bull; Violates PCI-DSS, SOC 2 Type II, and HIPAA compliance</text>
  <text x="70" y="415" fill="#ef4444" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">REGULATORY FINES &bull; DATA EXTORTION &bull; REPUTATION DAMAGE</text>

  <!-- Right: Zero-Trust Architecture -->
  <rect x="530" y="80" width="430" height="380" rx="10" fill="#081826" stroke="#10b981" stroke-width="1.5"/>
  <rect x="545" y="95" width="400" height="34" rx="6" fill="#10b981" fill-opacity="0.2"/>
  <text x="745" y="118" fill="#34d399" font-family="-apple-system, sans-serif" font-weight="700" font-size="14" text-anchor="middle">
    Hardened: S3PolicyForge Pro Zero-Trust
  </text>

  <rect x="545" y="145" width="400" height="60" rx="6" fill="#080c1a" stroke="#242f5d"/>
  <text x="560" y="170" fill="#34d399" font-family="monospace" font-size="11">Deny aws:SecureTransport: false &bull; vpce-0123... bound</text>
  <text x="560" y="190" fill="#38bdf8" font-family="monospace" font-size="11">KMS SSE Mandate &bull; S3 Public Access Block Enforced</text>

  <rect x="545" y="220" width="400" height="220" rx="6" fill="#071b22" stroke="#10b981" stroke-opacity="0.4"/>
  <text x="560" y="245" fill="#34d399" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">ENTERPRISE ZERO-TRUST GUARANTEES:</text>
  <text x="560" y="275" fill="#86efac" font-family="-apple-system, sans-serif" font-size="11">&bull; Mandatory TLS Deny guarantees 100% encrypted in-transit traffic</text>
  <text x="560" y="305" fill="#86efac" font-family="-apple-system, sans-serif" font-size="11">&bull; VPC Endpoint condition blocks external stolen credential abuse</text>
  <text x="560" y="335" fill="#86efac" font-family="-apple-system, sans-serif" font-size="11">&bull; KMS encryption condition blocks plaintext unencrypted uploads</text>
  <text x="560" y="365" fill="#86efac" font-family="-apple-system, sans-serif" font-size="11">&bull; Mathematical action-to-ARN scope alignment prevents syntax bugs</text>
  <text x="560" y="415" fill="#10b981" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">100% DATA PROTECTION &bull; SOC 2 / HIPAA READY &bull; ZERO EXPOSURE</text>
</svg>
