<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgDarkS3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070a14"/>
      <stop offset="100%" stop-color="#03050a"/>
    </linearGradient>
    <linearGradient id="accentGradS3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bgDarkS3)"/>

  <!-- Top App Header -->
  <rect x="30" y="24" width="1140" height="60" rx="10" fill="#0e1428" stroke="#1c274c" stroke-width="1.5"/>
  <rect x="46" y="38" width="55" height="32" rx="8" fill="url(#accentGradS3)"/>
  <text x="73" y="59" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="800" font-size="12" text-anchor="middle">S3-IAM</text>
  
  <text x="115" y="55" fill="#f8fafc" font-family="-apple-system, sans-serif" font-weight="700" font-size="18">S3PolicyForge Pro</text>
  <text x="315" y="55" fill="#06b6d4" font-family="-apple-system, sans-serif" font-weight="600" font-size="12">v1.0.0</text>
  <text x="365" y="55" fill="#64748b" font-family="-apple-system, sans-serif" font-size="13">| AWS S3 Bucket Policy &amp; Zero-Trust Studio &bull; Multi-Cloud Synthesizer</text>

  <rect x="880" y="40" width="135" height="28" rx="14" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-opacity="0.4"/>
  <text x="947" y="58" fill="#22d3ee" font-family="-apple-system, sans-serif" font-weight="600" font-size="11" text-anchor="middle">CIS BENCHMARK</text>

  <rect x="1025" y="40" width="130" height="28" rx="14" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4"/>
  <text x="1090" y="58" fill="#34d399" font-family="-apple-system, sans-serif" font-weight="600" font-size="11" text-anchor="middle">ZERO-TRUST VERIFIED</text>

  <!-- Left Column: Bucket Context & Security Controls -->
  <rect x="30" y="100" width="555" height="545" rx="12" fill="#0e1428" stroke="#1c274c" stroke-width="1.5"/>
  <text x="50" y="130" fill="#f8fafc" font-family="-apple-system, sans-serif" font-weight="700" font-size="15">Bucket Identity &amp; Zero-Trust Controls</text>

  <!-- Bucket Info -->
  <rect x="50" y="145" width="245" height="50" rx="6" fill="#080c1a" stroke="#1c274c"/>
  <text x="60" y="165" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">S3 BUCKET NAME</text>
  <text x="60" y="185" fill="#fbbf24" font-family="monospace" font-size="13" font-weight="700">enterprise-analytics-vault</text>

  <rect x="315" y="145" width="250" height="50" rx="6" fill="#080c1a" stroke="#1c274c"/>
  <text x="325" y="165" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">AWS REGION &bull; STATUS</text>
  <text x="325" y="185" fill="#34d399" font-family="monospace" font-size="13" font-weight="700">us-east-1 &bull; Active Enforced</text>

  <!-- Toggle Grid -->
  <text x="50" y="218" fill="#f8fafc" font-family="-apple-system, sans-serif" font-weight="700" font-size="13">Zero-Trust Security Toggles</text>
  
  <rect x="50" y="230" width="245" height="55" rx="8" fill="#080c1a" stroke="#10b981" stroke-width="1.2"/>
  <text x="65" y="252" fill="#34d399" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">🔒 Enforce TLS (HTTPS Only)</text>
  <text x="65" y="270" fill="#94a3b8" font-family="monospace" font-size="10">Denies aws:SecureTransport: false</text>

  <rect x="315" y="230" width="250" height="55" rx="8" fill="#080c1a" stroke="#10b981" stroke-width="1.2"/>
  <text x="330" y="252" fill="#34d399" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">🔑 Require KMS Encryption</text>
  <text x="330" y="270" fill="#94a3b8" font-family="monospace" font-size="10">Denies unencrypted PutObject</text>

  <rect x="50" y="295" width="245" height="55" rx="8" fill="#080c1a" stroke="#10b981" stroke-width="1.2"/>
  <text x="65" y="317" fill="#34d399" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">🌐 VPC Endpoint Gating</text>
  <text x="65" y="335" fill="#94a3b8" font-family="monospace" font-size="10">vpce-0123456789abcdef0</text>

  <rect x="315" y="295" width="250" height="55" rx="8" fill="#080c1a" stroke="#1c274c"/>
  <text x="330" y="317" fill="#f8fafc" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">☁️ CloudFront OAC Gating</text>
  <text x="330" y="335" fill="#94a3b8" font-family="monospace" font-size="10">Distribution ARN Verified</text>

  <!-- Active Statements List -->
  <text x="50" y="375" fill="#f8fafc" font-family="-apple-system, sans-serif" font-weight="700" font-size="13">Active Policy Statements</text>
  
  <rect x="50" y="390" width="515" height="65" rx="8" fill="#080c1a" stroke="#1c274c"/>
  <text x="65" y="412" fill="#ef4444" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">[DENY] EnforceTLSRequestsOnly</text>
  <text x="65" y="432" fill="#94a3b8" font-family="monospace" font-size="10">Principal: * &bull; Action: s3:* &bull; Condition: aws:SecureTransport == false</text>

  <rect x="50" y="465" width="515" height="65" rx="8" fill="#080c1a" stroke="#1c274c"/>
  <text x="65" y="487" fill="#ef4444" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">[DENY] DenyAccessOutsideCorporateVPCEndpoint</text>
  <text x="65" y="507" fill="#94a3b8" font-family="monospace" font-size="10">Principal: * &bull; Action: s3:* &bull; Condition: aws:sourceVpce != vpce-0123...</text>

  <rect x="50" y="540" width="515" height="65" rx="8" fill="#080c1a" stroke="#1c274c"/>
  <text x="65" y="562" fill="#10b981" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">[ALLOW] AllowAnalyticsRoleReadWrite</text>
  <text x="65" y="582" fill="#94a3b8" font-family="monospace" font-size="10">Principal: AnalyticsProcessingRole &bull; Action: GetObject, PutObject, ListBucket</text>

  <text x="50" y="628" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11">✅ ARN Scope Aligned: Bucket actions target bucket, object actions target /*</text>

  <!-- Right Column: 10-Point Scorecard & Synthesizer -->
  <rect x="615" y="100" width="555" height="545" rx="12" fill="#0e1428" stroke="#1c274c" stroke-width="1.5"/>

  <!-- Score banner -->
  <rect x="635" y="120" width="515" height="70" rx="10" fill="#0f1b36" stroke="#1c274c"/>
  <rect x="650" y="130" width="50" height="50" rx="8" fill="#10b981" fill-opacity="0.2" stroke="#10b981"/>
  <text x="675" y="163" fill="#34d399" font-family="monospace" font-weight="800" font-size="22" text-anchor="middle">A+</text>
  <text x="715" y="148" fill="#f8fafc" font-family="-apple-system, sans-serif" font-weight="700" font-size="16">Zero-Trust Score: 100 / 100</text>
  <text x="715" y="168" fill="#34d399" font-family="-apple-system, sans-serif" font-size="12">Production Ready • CIS Benchmark Compliant • Zero Public Exposure</text>

  <!-- Checklist items -->
  <rect x="635" y="200" width="515" height="32" rx="6" fill="#080c1a" stroke="#1c274c"/>
  <text x="650" y="221" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11">✅ Public Read Exposure Guard (15/15 pts) - Zero anonymous read access</text>

  <rect x="635" y="238" width="515" height="32" rx="6" fill="#080c1a" stroke="#1c274c"/>
  <text x="650" y="259" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11">✅ Public Write &amp; Ransomware Guard (15/15 pts) - Anonymous write blocked</text>

  <rect x="635" y="276" width="515" height="32" rx="6" fill="#080c1a" stroke="#1c274c"/>
  <text x="650" y="297" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11">✅ TLS In-Transit Encryption (15/15 pts) - aws:SecureTransport enforced</text>

  <rect x="635" y="314" width="515" height="32" rx="6" fill="#080c1a" stroke="#1c274c"/>
  <text x="650" y="335" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11">✅ KMS Encryption Upload Mandate (10/10 pts) - Deny unencrypted uploads</text>

  <rect x="635" y="352" width="515" height="32" rx="6" fill="#080c1a" stroke="#1c274c"/>
  <text x="650" y="373" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11">✅ ARN Scope Alignment (10/10 pts) - Bucket/object actions cleanly mapped</text>

  <!-- Synthesizer Box -->
  <text x="635" y="405" fill="#f8fafc" font-family="-apple-system, sans-serif" font-weight="700" font-size="13">Multi-Cloud Synthesizer (Active: Terraform HCL)</text>
  <rect x="635" y="415" width="515" height="215" rx="8" fill="#080c1a" stroke="#1c274c"/>
  <text x="650" y="438" fill="#38bdf8" font-family="monospace" font-size="10">resource "aws_s3_bucket_policy" "enterprise_analytics_vault_policy" {</text>
  <text x="650" y="458" fill="#38bdf8" font-family="monospace" font-size="10">  bucket = "enterprise-analytics-vault"</text>
  <text x="650" y="478" fill="#38bdf8" font-family="monospace" font-size="10">  policy = jsonencode({ "Version": "2012-10-17", "Statement": [...] })</text>
  <text x="650" y="498" fill="#38bdf8" font-family="monospace" font-size="10">}</text>
  <text x="650" y="525" fill="#c084fc" font-family="monospace" font-size="10">resource "aws_s3_bucket_public_access_block" "enterprise_analytics_vault_block" {</text>
  <text x="650" y="545" fill="#c084fc" font-family="monospace" font-size="10">  block_public_acls = true | block_public_policy = true | restrict_public_buckets = true</text>
  <text x="650" y="565" fill="#c084fc" font-family="monospace" font-size="10">}</text>
  <text x="650" y="605" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">&bull; 1-click export for AWS S3 JSON, Terraform HCL, AWS CLI, Cloudflare R2, MinIO</text>
</svg>
